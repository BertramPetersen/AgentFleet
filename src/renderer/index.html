<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgentFleet</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com; media-src 'self' blob: mediastream:; frame-src http://127.0.0.1:*;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for everything the user reads, JetBrains Mono for code and
         terminals. Press Start 2P is gone with the rest of the game. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        background: #0D1117; color: #E7EBF0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 44px; height: 44px;
        background: #F4D35E; color: #231D05; border-radius: 10px;
        font-family: "Inter", system-ui, sans-serif; font-size: 15px; font-weight: 700;
        letter-spacing: 0.02em;
      }
      #cth-splash .title { font-size: 15px; font-weight: 640; letter-spacing: 0.01em; }
      #cth-splash .hint { font-size: 14px; color: #6D7A89; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">AF</div>
        <div class="title">AgentFleet</div>
        <div class="hint">starting the fleet…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
