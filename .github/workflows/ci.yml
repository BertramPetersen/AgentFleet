name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (node + web)
        run: npm run typecheck
      # The assignment rules' behavioral spec, run through the real replay
      # harness over a synthesized hive history. Cheap (seconds), and it is the
      # only executable check on how work gets routed.
      - name: Replay selftest (assignment rules)
        run: |
          git config --global user.name Hive
          git config --global user.email hive@local
          npm run replay:selftest
          npm run compliance:selftest

  build:
    name: Build
    runs-on: macos-latest
    # Build exercises the native node-pty rebuild; allowed to fail without blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
